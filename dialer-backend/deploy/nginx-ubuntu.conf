# ============================================================
# 邀约宝后端 - Ubuntu (Linux) 版 HTTPS + 反向代理配置
# 适用：腾讯云轻量应用服务器 Ubuntu 22.04 + Nginx（宝塔或原生）
# 配套证书：来自 D:\yaoyuebao_nginx_extract 下载的 Nginx 版证书
#   - yaoyuebao.cn_nginx/yaoyuebao.cn_bundle.pem + .key  → 主站 / 员工后台
#   - api.yaoyuebao.cn_nginx/api.yaoyuebao.cn_bundle.pem + .key → 小程序 API 子域
#
# 部署步骤：
#   1. 将证书上传到服务器：
#      /etc/nginx/ssl/yaoyuebao.cn/yaoyuebao.cn_bundle.pem  + yaoyuebao.cn.key
#      /etc/nginx/ssl/api.yaoyuebao.cn/api.yaoyuebao.cn_bundle.pem + api.yaoyuebao.cn.key
#   2. 将本文件放到 /etc/nginx/sites-available/yaoyuebao.conf
#   3. 软链启用：ln -s /etc/nginx/sites-available/yaoyuebao.conf /etc/nginx/sites-enabled/
#   4. 前端文件放到 /var/www/yaoyuebao/frontend/（对应 root 指令）
#   5. 校验并重载：nginx -t && systemctl reload nginx
#
# 说明：bundle.pem 已含完整证书链（服务器证书 + 中间 CA），直接作为 ssl_certificate 即可。
#       小程序调 https://api.yaoyuebao.cn/api/...，员工后台走 https://yaoyuebao.cn
# ============================================================

# ---------- HTTP → HTTPS 统一跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name yaoyuebao.cn www.yaoyuebao.cn api.yaoyuebao.cn;

    # 证书申请期 ACME 校验等如需放行可在此追加 location，这里统一 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 / 员工后台（yaoyuebao.cn / www）----------
# 该域名证书 SAN 覆盖 yaoyuebao.cn 与 www.yaoyuebao.cn
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yaoyuebao.cn www.yaoyuebao.cn;

    # ---------- SSL 证书（主域名证书）----------
    ssl_certificate     /etc/nginx/ssl/yaoyuebao.cn/yaoyuebao.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/yaoyuebao.cn/yaoyuebao.cn.key;

    # ---------- SSL 安全配置 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---------- 前端静态文件（员工后台 H5 单页应用）----------
    root /var/www/yaoyuebao/frontend;
    index index.html;

    # ---------- 后端 API 反代（同源 /api 前缀，对应 main.py 挂载的前端同源部署）----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }

    # ---------- 健康检查（可选，便于监控）----------
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # ---------- 前端路由（单页应用兜底，未命中文件时回退 index.html）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 小程序 API（api.yaoyuebao.cn）----------
# 该子域名使用独立证书（api.yaoyuebao.cn_nginx），不可与主站共用一个 server 块
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yaoyuebao.cn;

    # ---------- SSL 证书（api 子域名证书）----------
    ssl_certificate     /etc/nginx/ssl/api.yaoyuebao.cn/api.yaoyuebao.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/api.yaoyuebao.cn/api.yaoyuebao.cn.key;

    # ---------- SSL 安全配置（同主站）----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------- 小程序直连 API：所有 /api/* 反代到后端 8000 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }

    # ---------- 健康检查（微信服务器会校验 /health 是否可达）----------
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
