# ============================================================
# 邀约宝后端 - HTTPS + 反向代理完整配置
# 适用于 Windows Server + Nginx + 腾讯云免费 SSL 证书
# ============================================================
#
# 使用步骤：
#   1. 从腾讯云 SSL 证书控制台下载 Nginx 版证书（.pem + .key）
#   2. 将证书放入 D:\nginx\conf\certs\ 目录
#   3. 替换下方 YOUR_DOMAIN 为实际域名
#   4. 复制本文件内容到 D:\nginx\conf\nginx.conf
#   5. 启动： D:\nginx\nginx.exe
#   6. 测试： curl https://api.yaoyuebao.cn/health
#
# 证书申请（腾讯云免费证书）：
#   控制台 → SSL 证书 → 申请免费证书 → 填入 api.yaoyuebao.cn
#
# ============================================================

# ---------- 全局配置 ----------
worker_processes  1;

error_log  D:/nginx/logs/error.log;
pid        D:/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # ---------- 基础设置 ----------
    include       D:/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 版本号（安全）
    server_tokens off;

    # 日志格式（便于分析访问日志）
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    # 访问日志路径
    access_log  D:/nginx/logs/access.log  main;
    error_log   D:/nginx/logs/error.log  warn;

    # ---------- 性能优化 ----------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # 上传文件大小限制（支持 Excel 批量导入，最大 20MB）
    client_max_body_size  20m;

    # Gzip 压缩（减少传输量，加速响应）
    gzip  on;
    gzip_vary  on;
    gzip_proxied  any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types  text/plain text/css text/xml application/json
                application/javascript application/xml application/xml+rss
                application/javascript application/x-javascript;

    # ---------- HTTP 跳转 HTTPS ----------
    # 监听 80 端口，所有请求 301 重定向到 HTTPS
    server {
        listen            80;
        listen            [::]:80;
        server_name       api.yaoyuebao.cn yaoyuebao.cn www.yaoyuebao.cn;

        # ---------- 健康检查路径（HTTP 也允许访问） ----------
        location = /health {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            access_log off;
        }

        # 其他路径全部跳转到 HTTPS
        location / {
            return  301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS 服务器 ----------
    server {
        listen                443 ssl;
        listen                [::]:443 ssl;
        server_name           api.yaoyuebao.cn yaoyuebao.cn www.yaoyuebao.cn;

        # ---------- SSL 证书 ⚠️ 替换这里 ----------
        #   腾讯云申请证书后下载 Nginx 版，解压后有：
        #     your_domain.pem  （证书文件）
        #     your_domain.key  （私钥文件，绝对保密！）
        #   将 YOUR_DOMAIN 替换为你的实际域名
        #   例：api.yaoyuebao.cn.pem / api.yaoyuebao.cn.key
        ssl_certificate     D:/nginx/conf/certs/YOUR_DOMAIN.pem;
        ssl_certificate_key  D:/nginx/conf/certs/YOUR_DOMAIN.key;

        # ---------- SSL 安全配置 ----------
        # 协议版本（禁用 TLSv1.0 和 TLSv1.1，仅保留 1.2 和 1.3）
        ssl_protocols  TLSv1.2 TLSv1.3;

        # 密码套件（Modern 兼容性配置）
        ssl_ciphers    ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # 优先使用服务器端加密套件
        ssl_prefer_server_ciphers  on;

        # SSL Session 缓存（减少 TLS 握手开销）
        ssl_session_cache    shared:SSL:50m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # ---------- 安全响应头 ----------
        # 强制 HTTPS（防止 HTTP 中间人劫持）
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

        # 防止点击劫持（X-Frame-Options）
        add_header X-Frame-Options              "SAMEORIGIN" always;

        # 防止 MIME 类型嗅探
        add_header X-Content-Type-Options       "nosniff" always;

        # XSS 过滤提示（现代浏览器已内置，这里多一层保护）
        add_header X-XSS-Protection             "1; mode=block" always;

        # 引用来源策略（防止图片盗链，可按需调整）
        add_header Referrer-Policy               "no-referrer-when-downgrade" always;

        # ---------- 日志 ----------
        access_log  D:/nginx/logs/ssl_access.log  main;
        error_log   D:/nginx/logs/ssl_error.log   warn;

        # ---------- 健康检查（不需要认证） ----------
        location = /health {
            proxy_pass         http://127.0.0.1:8000/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            access_log         off;
        }

        # ---------- 反向代理到后端（Waitress 端口 8000） ----------
        location / {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;

            # 转发请求头（关键！让后端能获取真实客户端 IP）
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $host;
            proxy_set_header    X-Forwarded-Port   $server_port;

            # WebSocket 支持（如果未来需要实时通信）
            proxy_set_header    Upgrade            $http_upgrade;
            proxy_set_header    Connection         "upgrade";
            proxy_read_timeout  86400;

            # 超时设置
            proxy_connect_timeout   60s;
            proxy_send_timeout      60s;
            proxy_buffering         off;

            # 上传大文件
            client_max_body_size    20m;
            proxy_request_buffering off;
        }

        # ---------- API 文档（Swagger UI）----------
        # 访问 https://api.yaoyuebao.cn/docs 即可打开 API 文档
        location /docs {
            proxy_pass          http://127.0.0.1:8000/docs;
            proxy_http_version  1.1;
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-Proto https;
        }

        location /openapi.json {
            proxy_pass          http://127.0.0.1:8000/openapi.json;
            proxy_http_version  1.1;
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
        }

        # ---------- 静态文件代理（扩展能力） ----------
        # 如果前端小程序有静态资源（图片/CSS/JS）通过后端托管
        # 访问 /media/xxx → 代理到 D:\dialer\media\
        location /media/ {
            alias  D:/dialer/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            # 禁止访问上级目录（安全）
            if ($request_filename ~* \.(php|jsp|cgi|asp|aspx|exe)$) {
                return 403;
            }
        }

        # ---------- 根路径重定向 ----------
        location = / {
            proxy_pass  http://127.0.0.1:8000/;
            proxy_set_header Host $host;
        }
    }
}
