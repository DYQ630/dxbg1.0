; ============================================================
; 邀约宝后端 - 进程守护配置（Supervisor 备选方案）
; ⚠️ 主推方案为 systemd（deploy/yaoyuebao.service）；本文件仅作【备选】：
;    当你的运行环境没有 systemd（如某些容器、老旧发行版）时使用 Supervisor。
;
; 用法：
;   sudo apt install supervisor
;   sudo cp deploy/supervisor.ini /etc/supervisor/conf.d/yaoyuebao.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status yaoyuebao
;
; 说明：本配置已与上云改造后的源码对齐：
;   - 使用 gunicorn（非 waitress），匹配 requirements.txt 新增的 gunicorn 依赖
;   - 通过 environment 注入 DB_PATH / SECRET_KEY（匹配 database.py / auth.py 的 os.environ.get）
;   - 路径统一为 /var/www/yaoyuebao、/var/lib/yaoyuebao（与 nginx-ubuntu.conf / setup_ubuntu.sh 一致）
; ============================================================

[program:yaoyuebao]
; 启动命令：gunicorn 跑 ASGI（uvicorn worker），仅监听本机回环 8000
command=/var/www/yaoyuebao/dialer-backend/venv/bin/gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b 127.0.0.1:8000 app.main:app
directory=/var/www/yaoyuebao/dialer-backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/yaoyuebao/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
; 通过 environment 注入生产环境变量（与 database.py / auth.py 读取的键名一致）
environment=DB_PATH="/var/lib/yaoyuebao/dialer.db",SECRET_KEY="change_me_to_random_secret",ENV="production"
startsecs=5
startretries=3
stopwaitsecs=30
